name: Disposable Windows Ubuntu WSL setup spike
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Agent 100 version
        required: true
        default: '1.5.1'
permissions:
  contents: read
concurrency:
  group: a100-wsl-setup
  cancel-in-progress: false
jobs:
  ubuntu-wsl:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      A100_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install native Windows browser harness
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          exit $LASTEXITCODE
      - name: Validate version input
        shell: pwsh
        run: |
          if ($env:A100_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Exact numeric release version required' }
      - name: Install Ubuntu, probe launch, then run Linux package journey
        shell: pwsh
        run: ./scripts/wsl-setup-spike.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-wsl-setup
          path: artifacts/
          retention-days: 7
